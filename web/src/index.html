<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07060a">
<title>Halo Player</title>
<style>/*@FONTS@*/</style>
<style>/*@CSS@*/</style>
</head>
<body>
<div id="app" data-theme="albums">
  <div id="bg">
    <div id="bgAurora"></div>
    <div id="bgArt"></div>
    <img id="bgImg" alt="">
    <video id="bgVideo" muted loop playsinline autoplay preload="auto"></video>
    <div id="bgYT"><div id="ytFrame"></div></div>
    <div id="bgDim"></div>
  </div>
  <div id="clock"><div class="date"></div><div class="time"></div></div>
  <section id="stage"></section>
  <div id="lyrics"><div class="wrap"></div></div>
  <div id="klyr"></div>
  <canvas id="glow"></canvas>

  <div id="srcBadge"><span class="srcdot"></span><span class="name">Demó</span><span class="out"></span></div>
  <div id="devBanner" class="panel"></div>
  <div id="tools">
    <button class="ib" data-act="mic" aria-label="Hangvezérlés"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4M8 21h8"/></svg></button>
    <button class="ib" data-act="cast" aria-label="Eszközök és Chromecast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 16.1A5 5 0 0 1 5.9 20M2 12.05A9 9 0 0 1 9.95 20M2 8V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/><path d="M2 20h.01"/></svg></button>
    <button class="ib" data-act="library" aria-label="Keresés és könyvtár"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
    <button class="ib" data-act="lyrics" aria-label="Dalszöveg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9 10h6M9 14h4"/></svg></button>
    <button class="ib" data-act="next-theme" aria-label="Következő téma"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
    <button class="ib" data-act="fullscreen" aria-label="Teljes képernyő"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="ib" data-act="settings" aria-label="Beállítások"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <div id="toast"></div>

  <div id="onboard" class="panel">
    <h3>Kösd össze a lejátszóddal</h3>
    <p>A Halo a telefonon/tableten épp szóló zenét jeleníti meg és vezérli — Spotify, SoundCloud, YouTube Music, YouTube. Ehhez engedélyezd az <b>Értesítés-hozzáférést</b>. Jelszó vagy fiókadat nem kell.</p>
    <div class="apps"><span><i class="srcdot" style="--src:#1ed760"></i>Spotify</span><span><i class="srcdot" style="--src:#ff5500"></i>SoundCloud</span><span><i class="srcdot" style="--src:#ff0033"></i>YouTube</span></div>
    <button class="btn pri" data-act="grant">Engedélyezés</button>
  </div>

  <div id="scrim"></div>
  <section id="lib" class="overlay">
    <header class="lh">
      <button class="ib" id="libBack" aria-label="Vissza"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <label class="lq"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="libQ" type="search" placeholder="Dalok, albumok, előadók…" autocomplete="off" spellcheck="false" enterkeyhint="search"></label>
      <button class="ib" id="libClose" aria-label="Bezárás"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <nav id="libTabs"><button data-tab="search" class="on">Keresés</button><button data-tab="lists">Lejátszólisták</button><button data-tab="recent">Előzmények</button></nav>
    <div id="libBody"></div>
  </section>
  <section id="dev" class="overlay">
    <header class="lh"><h2>Eszközök</h2><button class="ib" id="devClose" aria-label="Bezárás"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
    <div id="devBody"></div>
  </section>
  <div id="voice" class="panel" role="status" aria-live="polite"><div class="orb"><i></i><i></i><i></i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v4M8 21h8"/></svg></div><div class="vt"><div id="voiceText">Listening…</div><div id="voiceHint"></div></div></div>
  <aside id="sheet" class="overlay"></aside>
  <input type="file" id="filePick" accept="video/*,image/*" hidden>
  <input type="file" id="audioPick" accept="audio/*" multiple hidden>
  <audio id="audio" preload="auto"></audio>
</div>
<script>/*@JS@*/</script>
</body>
</html>
